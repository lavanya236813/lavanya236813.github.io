function Contact(){
 const[f,setF]=useState({n:'',e:'',m:''}),[er,setEr]=useState({}),[tc,setTc]=useState(false),[st,setSt]=useState(0);

/* App shell: Framer Motion transitions, one style per layer */
const D={opacity:1,scale:1,x:0,y:0,filter:'blur(0px)'};
const TR=[d=>({y:40*d,scale:.98}),d=>({x:60*d}),d=>({scale:.94}),d=>({y:-40*d}),d=>({x:-60*d}),d=>({scale:1.05}),d=>({y:40*d}),d=>({scale:.96})];
const VA={e:c=>({...D,opacity:0,filter:'blur(10px)',...TR[c.i](c.d)}),c:D,x:c=>{const r=TR[c.i](c.d);return{...D,opacity:0,filter:'blur(10px)',x:-(r.x||0),y:-(r.y||0),scale:r.scale?2-r.scale:1}}};

const NAMES=['home','hire','resume','projects','systems','contact','experience','network'],LAB=['Home','Hire me','Résumé','Projects','Systems','Contact','Experience','Network'];

function Intro(){
 const[x,setX]=useState(false);useEffect(()=>{const t=setTimeout(()=>setX(true),1900);return()=>clearTimeout(t)},[]);
 return h`<${AnimatePresence}>${!x&&h`<${motion.div} key="i" className="intro" initial=${{clipPath:'inset(0% 0% 0% 0%)'}} animate=${{clipPath:'inset(0% 0% 0% 0%)'}} exit=${{clipPath:'inset(0% 0% 100% 0%)'}} transition=${{duration:.9,ease:EA}}><div><${Num} to=${100}/>%</div><${motion.i} initial=${{scaleX:0}} animate=${{scaleX:1}} transition=${{duration:1.6,ease:'easeInOut'}}/><small>loading portfolio</small><//>`}<//>`;

function App(){
 const init=Math.max(0,NAMES.indexOf(location.hash.slice(1)));window.__L=init;
 const[[i,d],setP]=useState([init,1]);const cur=useRef(init),lock=useRef(true);
 const go=useCallback(n=>{if(lock.current||n<0||n>=NAMES.length||n===cur.current)return;lock.current=true;setTimeout(()=>lock.current=false,900);setP([n,n>cur.current?1:-1]);cur.current=n;window.__L=n;try{history.replaceState(null,'','#'+NAMES[n])}catch(e){}},[]);
 useEffect(()=>{
  setTimeout(()=>lock.current=false,2000);
  const edge=()=>{const el=document.querySelector('.pg');return el?[el.scrollTop<=0,el.scrollTop+el.clientHeight>=el.scrollHeight-2]:[true,true]};
  const wh=e=>{const[t,b]=edge();if(e.deltaY>20&&b)go(cur.current+1);else if(e.deltaY<-20&&t)go(cur.current-1)};
  let sy=0,eg=[true,true];const ts=e=>{sy=e.touches[0].clientY;eg=edge()};
  const te=e=>{const dy=sy-e.changedTouches[0].clientY;if(dy>70&&eg[1])go(cur.current+1);else if(dy<-70&&eg[0])go(cur.current-1)};
  const kd=e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowDown'||e.key==='PageDown')go(cur.current+1);if(e.key==='ArrowUp'||e.key==='PageUp')go(cur.current-1)};
  const hc=()=>{const k=NAMES.indexOf(location.hash.slice(1));if(k>=0)go(k)};
  addEventListener('wheel',wh,{passive:true});addEventListener('touchstart',ts,{passive:true});addEventListener('touchend',te,{passive:true});addEventListener('keydown',kd);addEventListener('hashchange',hc);
  return()=>{removeEventListener('wheel',wh);removeEventListener('touchstart',ts);removeEventListener('touchend',te);removeEventListener('keydown',kd);removeEventListener('hashchange',hc)};
 },[go]);
 const P=PG[i];
 return h`<${React.Fragment}><${Intro}/>
  <div className="brand">~/lavanya</div>
  <nav className="rail" aria-label="Layers">${LAB.map((l,k)=>h`<button key=${k} aria-label=${l} aria-current=${k===i} className=${k===i?'on':''} onClick=${()=>go(k)}><span>${l}</span></button>`)}</nav>
  <${AnimatePresence} mode="wait" custom=${{i,d}}><${motion.main} key=${i} className="pg" custom=${{i,d}} variants=${VA} initial="e" animate="c" exit="x" transition=${{duration:.5,ease:EA}}><${P} go=${go}/><//><//>
  <div className="hud" aria-hidden="true"><span>layer ${pad(i+1)}/${pad(NAMES.length)}</span><b>${LAB[i]}</b><div><i style=${{transform:'scaleX('+(i+1)/NAMES.length+')'}}/></div></div>
  <div className="arr"><button aria-label="Previous layer" onClick=${()=>go(cur.current-1)}>↑</button><button aria-label="Next layer" onClick=${()=>go(cur.current+1)}>↓</button></div><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
